# NetworkPolicy for the KEDA HTTP Add-on Interceptor.
# Customize the ingress controller selectors and backend egress scope for your cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: interceptor
  namespace: keda
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: interceptor
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Proxy traffic from your ingress controller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
    # Admin API for the external scaler (same namespace).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: scaler
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Proxy to backends. This example matches examples/xkcd in default.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
      ports:
        - protocol: TCP
          port: 8080
    # Kubernetes API (ClusterIP / control-plane IPs, not a selectable pod).
    # Restrict with ipBlock in production.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

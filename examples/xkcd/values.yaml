replicaCount: 1
hosts:
  - "myhost.com"
  - "myhost2.com"
pathPrefixes:
  - "/path1"
  - "/path2"
targetPendingRequests: 200
# This is the namespace that the ingress should be installed
# into. It should be set to the same namespace as the
# KEDA HTTP componentry is installed in. Defaults to the Helm
# chart release namespace
ingressNamespace:
image:
  repository: registry.k8s.io/e2e-test-images/agnhost
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "2.61@sha256:101f3357d1ad890c3090e78ea6c6a47dc5137cbe19836796e13d5dcb2b84d2e6"

args:
  - netexec

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

autoscaling:
  http:
    minReplicas: 0
    maxReplicas: 10

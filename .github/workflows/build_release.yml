name: Publish official image to GitHub Container Registry

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # needed for signing images and release manifests with GitHub OIDC Token
      attestations: write # needed for SLSA Build L2 provenance attestations
      artifact-metadata: write # needed for org-level linked artifacts dashboard

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      - name: Get the version
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          # Username used to log in to a Docker registry. If not set then no login will occur
          username: ${{ github.repository_owner }}
          # Password or personal access token used to log in to a Docker registry. If not set then no login will occur
          password: ${{ secrets.GITHUB_TOKEN }}
          # Server address of Docker registry. If not set then will default to Docker Hub
          registry: ghcr.io

      - name: Publish on GitHub Container Registry
        run: make publish
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Parse image digests
        id: digests
        run: |
          for component in operator interceptor scaler; do
            ref=$(cat "${component}.digest")
            echo "${component}_name=${ref%%@*}" >> "$GITHUB_OUTPUT"
            echo "${component}_digest=${ref##*@}" >> "$GITHUB_OUTPUT"
          done

      - name: Attest operator image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digests.outputs.operator_name }}
          subject-digest: ${{ steps.digests.outputs.operator_digest }}
          push-to-registry: true

      - name: Attest interceptor image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digests.outputs.interceptor_name }}
          subject-digest: ${{ steps.digests.outputs.interceptor_digest }}
          push-to-registry: true

      - name: Attest scaler image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.digests.outputs.scaler_name }}
          subject-digest: ${{ steps.digests.outputs.scaler_digest }}
          push-to-registry: true

      - name: Release Deployment YAML file
        run: make release
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      # https://github.com/sigstore/cosign-installer
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check Cosign install!
        run: cosign version

      - name: Sign KEDA images published on GitHub Container Registry
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: make sign-images
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Sign release manifests
        run: |
          for f in "keda-add-ons-http-${VERSION}.yaml" "keda-add-ons-http-${VERSION}-crds.yaml"; do
            cosign sign-blob --yes "$f" --bundle "${f}.bundle.json"
          done
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      - name: Upload release assets
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "keda-add-ons-http-${VERSION}.yaml" \
            "keda-add-ons-http-${VERSION}.yaml.bundle.json" \
            "keda-add-ons-http-${VERSION}-crds.yaml" \
            "keda-add-ons-http-${VERSION}-crds.yaml.bundle.json" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
